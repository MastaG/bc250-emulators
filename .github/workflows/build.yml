name: Build and publish BC-250 emulator packages

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every component even when its fingerprint is unchanged
        required: true
        default: false
        type: boolean
  # Both upstreams publish releases several times a day; four checks a day pick
  # up the newest without rebuilding for every single release.
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'packages/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: repo-release
  cancel-in-progress: false

env:
  REPO_NAME: bc250-emulators
  RELEASE_TAG: repo

jobs:
  # What to build: the upstream commits and which components changed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.decide.outputs.components }}
      matrix: ${{ steps.decide.outputs.matrix }}
      lichii_tag: ${{ steps.resolve.outputs.lichii_tag }}
      lichii_build: ${{ steps.resolve.outputs.lichii_build }}
      lichii_commit: ${{ steps.resolve.outputs.lichii_commit }}
      lichii_bc250_commit: ${{ steps.resolve.outputs.lichii_bc250_commit }}
      kyty_tag: ${{ steps.resolve.outputs.kyty_tag }}
      kyty_commit: ${{ steps.resolve.outputs.kyty_commit }}
      lichii_fingerprint: ${{ steps.decide.outputs.lichii_fingerprint }}
      lichii_bc250_fingerprint: ${{ steps.decide.outputs.lichii_bc250_fingerprint }}
      kytyps5_native_git_fingerprint: ${{ steps.decide.outputs.kytyps5_native_git_fingerprint }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve upstream releases
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # Repository variables: set one to a tag to build that release
          # instead of the newest one.
          LICHII_TAG: ${{ vars.LICHII_TAG }}
          KYTY_TAG: ${{ vars.KYTY_TAG }}
        run: |
          set -euo pipefail
          eval "$(./scripts/resolve-lichii.sh)"
          eval "$(./scripts/resolve-lichii-bc250.sh)"
          eval "$(./scripts/resolve-kytyps5-native.sh)"
          {
            echo "lichii_tag=$LICHII_TAG"
            echo "lichii_build=$LICHII_BUILD"
            echo "lichii_commit=$LICHII_COMMIT"
            echo "lichii_bc250_commit=$LICHII_BC250_COMMIT"
            echo "kyty_tag=$KYTY_TAG"
            echo "kyty_commit=$KYTY_COMMIT"
          } >> "$GITHUB_OUTPUT"
          echo "Lichii:         $LICHII_TAG ($LICHII_COMMIT)"
          echo "Lichii BC-250:  main ($LICHII_BC250_COMMIT)"
          echo "KytyPS5-Native: $KYTY_TAG ($KYTY_COMMIT)"

      - name: Decide what to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LICHII_COMMIT: ${{ steps.resolve.outputs.lichii_commit }}
          LICHII_BC250_COMMIT: ${{ steps.resolve.outputs.lichii_bc250_commit }}
          KYTY_COMMIT: ${{ steps.resolve.outputs.kyty_commit }}
        run: |
          set -euo pipefail
          have_release=false
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && have_release=true
          components=()
          # component  info-file key
          while read -r component key; do
            fingerprint="$(./scripts/fingerprint.sh "$component")"
            echo "${key,,}=$fingerprint" >> "$GITHUB_OUTPUT"
            previous=""
            if [[ "$have_release" == true ]] &&
               gh release download "$RELEASE_TAG" -p "$component-info.env" -D "$RUNNER_TEMP" --clobber 2>/dev/null; then
              previous="$(sed -n "s/^$key=//p" "$RUNNER_TEMP/$component-info.env")"
            fi
            if [[ '${{ inputs.force }}' == true || "$fingerprint" != "$previous" ]]; then
              components+=("$component")
            fi
            printf '%-20s now %s, published %s\n' "$component" "$fingerprint" "${previous:-none}"
          done <<'EOF'
          lichii LICHII_FINGERPRINT
          lichii-bc250 LICHII_BC250_FINGERPRINT
          kytyps5-native-git KYTYPS5_NATIVE_GIT_FINGERPRINT
          EOF
          echo "components=${components[*]}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -cn '$ARGS.positional' --args "${components[@]}")" >> "$GITHUB_OUTPUT"
          echo "Build: ${components[*]:-nothing}"

  # One job per component, side by side: each starts from the published
  # repository, lets its build script replace that component's files, and
  # passes on only what changed (new or changed files, plus the names it
  # removed) for the publish job to merge.
  build:
    needs: plan
    if: needs.plan.outputs.components != ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          # The hosted runner's preinstalled SDKs leave too little room for the
          # LTO builds and their bundled dependencies.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Seed the published repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Everything the release has, so components not built this run keep
          # their packages, sidecars and database entries; each build replaces
          # only its own.
          mkdir -p out/repo
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -D out/repo || true
          fi
          ls -la out/repo
          # What the release had, to tell this build's changes apart.
          (cd out/repo && find . -maxdepth 1 -type f -printf '%f\0' | xargs -0r sha256sum --) > "$RUNNER_TEMP/before.sha256"

      - name: Build
        env:
          COMPONENT: ${{ matrix.component }}
          LICHII_TAG: ${{ needs.plan.outputs.lichii_tag }}
          LICHII_BUILD: ${{ needs.plan.outputs.lichii_build }}
          LICHII_COMMIT: ${{ needs.plan.outputs.lichii_commit }}
          LICHII_FINGERPRINT: ${{ needs.plan.outputs.lichii_fingerprint }}
          LICHII_BC250_COMMIT: ${{ needs.plan.outputs.lichii_bc250_commit }}
          LICHII_BC250_FINGERPRINT: ${{ needs.plan.outputs.lichii_bc250_fingerprint }}
          KYTY_TAG: ${{ needs.plan.outputs.kyty_tag }}
          KYTY_COMMIT: ${{ needs.plan.outputs.kyty_commit }}
          KYTYPS5_NATIVE_GIT_FINGERPRINT: ${{ needs.plan.outputs.kytyps5_native_git_fingerprint }}
          PKGREL: ${{ github.run_number }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e REPO_NAME -e PKGREL \
            -e LICHII_TAG -e LICHII_BUILD -e LICHII_COMMIT -e LICHII_FINGERPRINT \
            -e LICHII_BC250_COMMIT -e LICHII_BC250_FINGERPRINT \
            -e KYTY_TAG -e KYTY_COMMIT -e KYTYPS5_NATIVE_GIT_FINGERPRINT \
            archlinux:base-devel bash /workspace/scripts/ci-build.sh --no-database "$COMPONENT"

      - name: Collect the changes
        # A failed build changed nothing (the scripts touch out/repo only at
        # the end), so this is empty then and the publish job keeps the old
        # packages of this component.
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          declare -A before=()
          while read -r sum name; do before["$name"]="$sum"; done < "$RUNNER_TEMP/before.sha256"
          changes="$RUNNER_TEMP/changes"
          mkdir -p "$changes/files"
          : > "$changes/removed.txt"
          cd out/repo
          for file in *; do
            [[ -f "$file" ]] || continue
            sum="$(sha256sum -- "$file" | cut -d' ' -f1)"
            [[ "${before[$file]:-}" == "$sum" ]] && continue
            echo "changed: $file"
            cp -- "$file" "$changes/files/"
          done
          for name in "${!before[@]}"; do
            [[ -e "$name" ]] && continue
            echo "removed: $name"
            printf '%s\n' "$name" >> "$changes/removed.txt"
          done
          # One tarball: artifact uploads refuse some characters in file names.
          tar -C "$changes" -cf "$RUNNER_TEMP/changes-$COMPONENT.tar" .

      - name: Upload the changes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changes-${{ matrix.component }}
          path: ${{ runner.temp }}/changes-${{ matrix.component }}.tar
          if-no-files-found: ignore
          retention-days: 3

  # Merges every build's changes into the published repository, rewrites the
  # database and uploads. Also after a partly failed build: what did build is
  # published, a failed component keeps its previous packages.
  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.components != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Seed the published repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/repo
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" -D out/repo || true
          fi

      - name: Download the changes
        uses: actions/download-artifact@v8
        with:
          pattern: changes-*
          path: ${{ runner.temp }}/changes

      - name: Merge the changes
        id: merge
        run: |
          set -euo pipefail
          any=false
          shopt -s nullglob
          for tarball in "$RUNNER_TEMP"/changes/*/changes-*.tar; do
            dir="$(mktemp -d)"
            tar -C "$dir" -xf "$tarball"
            echo "== $(basename -- "$tarball" .tar)"
            while IFS= read -r name; do
              [[ -n "$name" && "$name" != */* ]] || continue
              echo "remove: $name"
              rm -f -- "out/repo/$name"
              any=true
            done < "$dir/removed.txt"
            for file in "$dir"/files/*; do
              echo "add: $(basename -- "$file")"
              cp -- "$file" out/repo/
              any=true
            done
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Write the database
        if: steps.merge.outputs.any == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e REPO_NAME \
            archlinux:base-devel bash /workspace/scripts/ci-build.sh --database-only

      - name: Publish
        if: steps.merge.outputs.any == 'true' && hashFiles('out/repo/bc250-emulators.db') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          value() { sed -n "s/^$2=//p" "out/repo/$1" 2>/dev/null; }
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "pacman repository for the AMD BC-250 (Zen 2 + Cyan Skillfish). Add to \`/etc/pacman.conf\`:"
            echo
            echo '```ini'
            echo "[$REPO_NAME]"
            echo 'SigLevel = Optional TrustAll'
            echo "Server = https://github.com/${GITHUB_REPOSITORY}/releases/download/$RELEASE_TAG"
            echo '```'
            echo
            echo 'Packaging only: no keys, firmware, BIOS files or games are included. See the README for setup.'
            if [[ -f out/repo/lichii-info.env ]]; then
              tag="$(value lichii-info.env LICHII_TAG)"
              echo
              echo "## lichii $(value lichii-info.env LICHII_PKGVER)-$(value lichii-info.env LICHII_PKGREL)"
              echo
              echo "Lichii [$tag](https://github.com/zortos293/lichii/releases/tag/$tag), built for the BC-250, plus \`lichii-steam-sync\`."
            fi
            if [[ -n "$(value lichii-bc250-info.env LICHII_BC250_COMMIT)" ]]; then
              commit="$(value lichii-bc250-info.env LICHII_BC250_COMMIT)"
              echo
              echo "## lichii-bc250 $(value lichii-bc250-info.env LICHII_BC250_PKGVER)-$(value lichii-bc250-info.env LICHII_BC250_PKGREL)"
              echo
              echo "The BC-250 Lichii fork, main at [\`${commit:0:9}\`](https://github.com/lethevimlet/lichii-bc250/commit/$commit)."
            fi
            if [[ -f out/repo/kytyps5-native-git-info.env ]]; then
              echo
              echo "## kytyps5-native-git $(value kytyps5-native-git-info.env KYTYPS5_NATIVE_GIT_PKGVER)-$(value kytyps5-native-git-info.env KYTYPS5_NATIVE_GIT_PKGREL)"
              echo
              echo "KytyPS5-Native, upstream release \`$(value kytyps5-native-git-info.env KYTYPS5_NATIVE_GIT_TAG)\`, plus \`kytyps5-steam-sync\`."
            fi
          } > "$notes"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "BC-250 emulator repository" --notes-file "$notes" --latest
          else
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          fi
          # Upload first, then delete what the repository no longer has, so the
          # database never points at a package that is not there.
          gh release upload "$RELEASE_TAG" out/repo/* --clobber
          mapfile -t published < <(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name')
          for asset in "${published[@]}"; do
            [[ -e "out/repo/$asset" ]] && continue
            echo "Removing stale asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
